version: '3.8'

services:
  api:
    build: .
    container_name: student_analytics_api
    ports:
      - "8000:8000"
    environment:
      - MONGO_URI=${MONGO_URI:-mongodb://mongo:27017}
      - MONGO_DB_NAME=${MONGO_DB_NAME:-student_analytics}
      - FASTAPI_PORT=8000
    depends_on:
      - mongo
    restart: always

  mongo:
    image: mongo:7.0
    container_name: student_analytics_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: always

volumes:
  mongo_data:
